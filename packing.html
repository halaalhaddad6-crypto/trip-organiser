<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قائمة تجهيز الرحلة</title>

    <link rel="stylesheet" href="packing.css" />
  </head>

  <body>
    <header class="header">
        <h1>قائمة تجهيز الرحلة 🎒</h1>
      <button id="theme-btn" class="icon-btn">🌙 الوضع الليلي</button>
    </header>
    <div class="packing-list">
      <p>تأكد من تجهيز جميع مستلزمات رحلتك:</p>

      <div class="add-item">
        <input type="text" id="itemInput" placeholder="أضف غرضاً للرحلة" />
        <button onclick="addItem()">إضافة</button>
      </div>

      <ul id="packingList">
        <li>
          <input type="checkbox" onclick="completeItem(this)" />
          خيمة ⛺
        </li>

        <li>
          <input type="checkbox" onclick="completeItem(this)" />
          ماء💧
        </li>

        <li>
          <input type="checkbox" onclick="completeItem(this)" />
          طعام🥪
        </li>

        <li>
          <input type="checkbox" onclick="completeItem(this)" />
          حقيبة إسعافات أولية🩹
        </li>

        <li>
          <input type="checkbox" onclick="completeItem(this)" />
          شاحن متنقل🔋
        </li>
      </ul>
      <div class="packing-buttons">
        <a href="mezaniah.html" class="next-btn"> انتقل لحساب الميزانية 💰 </a>

        <a href="Project.html" class="back-btn"> ← العودة للوجهات </a>
      </div>
    </div>
    <script src="packing-list.js"></script>
  </body>
</html>
