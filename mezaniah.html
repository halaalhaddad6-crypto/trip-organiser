<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mezaniah.css">
    <script src="mezaniah.js" defer></script>
    <title>Mezaniah</title>
</head>
<body>
    <header>
        <button id="theme-btn" class="icon-btn">🌙 الوضع الليلي</button>
        <a href="#" class="title"> :حاسبة الميزانية والمصاريف</a>
    </header>
    <section class="main"> 

        <div class="input-box">
            
            <div class="input-content">
                <label for="banzin">تكلفة البنزين</label>
                <input type="number" id="banzin" class="banzin" placeholder="تكلفة البنزين">
            </div>
            <img src="images/banzine.png" alt="بنزين">
        </div>

        <div class="input-box">
            
            <div class="input-content">
                <label for="food">تكلفة الطعام</label>
                <input type="number" id="food" class="food" placeholder="تكلفة الطعام">
            </div>
            <img src="images/food.png" alt="طعام">
        </div>

        <div class="input-box">
            
            <div class="input-content">
                <label for="activites">تكلفة الانشطة</label>
                <input type="number" id="activites" class="activites" placeholder="تكلفة الانشطة">
            </div>
            <img src="images/act.png" alt="الانشطة">
        </div>

        <div class="input-box">
            
            <div class="input-content">
                <label for="other">تكلفة اخرى</label>
                <input type="number" id="other" class="other" placeholder="تكلفة اخرى">
            </div>
            <img src="images/other.png" alt="اخرى">
        </div>
       
        <div class="total">
            <h3>اجمالي التكلفة </h3>
            <p>0 شيكل </p>
        </div>

        
        <div class="input-box">
            
            <div class="input-content">
                <label for="people"> عدد الاشخاص</label>
                <input type="number" id="people" class="people" placeholder="عدد الاشخاص">
            </div>
            <img src="images/people.png" alt="الاشخاص">
        </div>

        <div class="person-cost">
            <h3>التكلفة للفرد</h3>
            <p>0 شيكل</p>
        </div>
        
    </section>
</body>
</html>
